spring.application.name=voyai

# === DATABASE ===
spring.datasource.url=jdbc:mysql://localhost:3306/voyai?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === JPA ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# === SERVER ===
server.port=8080

# === CORS (Next.js dev) ===
cors.allowed-origins=http://localhost:3000

# === JWT ===
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# === GEMINI ===
gemini.api.key=${GEMINI_API_KEY}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.api.model=gemini-2.5-flash
gemini.api.timeout=60000

# === OPEN-METEO (không c?n key) ===
weather.api.base-url=https://api.open-meteo.com/v1

# === NOMINATIM ===
nominatim.api.base-url=https://nominatim.openstreetmap.org

# === ACTUATOR (gi?i h?n l?i cho an toàn) ===
management.endpoints.web.exposure.include=health,info

